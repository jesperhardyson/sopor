      #root:empty ~ .karl-laddar { display: flex; flex-direction: column; gap: 16px; position: fixed; inset: 0; padding: 0 20px; align-items: center; justify-content: center; opacity: 0; animation: karl-in .25s ease-out .3s forwards; }
      .karl-laddar svg { width: 150px; height: auto; overflow: visible; }
      /* Typsnitten har inte kommit än, så texten använder systemets */
      .karl-laddar .karl-text { margin: 0; max-width: 340px; min-height: 2.6em; font: 600 20px/1.3 system-ui, -apple-system, sans-serif; color: var(--text-2); text-align: center; animation: karl-text 3.6s ease-in-out infinite; }
      .karl-laddar .kropp, .karl-laddar .lock, .karl-laddar .fraktion { transform-box: view-box; }
      .karl-laddar .kropp { transform-origin: 240px 430px; animation: karl-gung var(--p) ease-in-out infinite; }
      .karl-laddar .lock { transform-origin: 358px 95px; }
      .karl-laddar .bak { animation: karl-lock var(--p) infinite, karl-bak var(--p) step-end infinite; }
      .karl-laddar .fram { animation: karl-lock var(--p) infinite, karl-fram var(--p) step-end infinite; }
      .karl-laddar .fraktion { opacity: 0; animation: karl-fall calc(var(--p) * 3) linear infinite; }
      .karl-laddar .f2 { animation-delay: var(--p); }
      .karl-laddar .f3 { animation-delay: calc(var(--p) * 2); }
      @keyframes karl-in { to { opacity: 1; } }
      @keyframes karl-text { 0%, 100% { opacity: 0; } 15%, 85% { opacity: 1; } }
      @keyframes karl-gung {
        0%, 14% { transform: rotate(0); }
        30%, 62% { transform: rotate(-3deg); }
        72% { transform: rotate(3deg); }
        82% { transform: rotate(-1.5deg); }
        91% { transform: rotate(.5deg); }
        100% { transform: rotate(0); }
      }
      @keyframes karl-lock {
        0%, 14% { transform: rotate(0); animation-timing-function: cubic-bezier(.2, .8, .3, 1); }
        30% { transform: rotate(38deg); animation-timing-function: ease-in-out; }
        38%, 58% { transform: rotate(33deg); animation-timing-function: cubic-bezier(.6, 0, 1, .6); }
        67%, 100% { transform: rotate(0); }
      }
      /* Öppet ligger locket bakom kroppen, stängt framför. SVG kan inte byta ordning, så det finns två. */
      @keyframes karl-bak { 0% { opacity: 0; } 16% { opacity: 1; } 66% { opacity: 0; } }
      @keyframes karl-fram { 0% { opacity: 1; } 16% { opacity: 0; } 66% { opacity: 1; } }
      @keyframes karl-fall {
        0%, 9% { opacity: 0; transform: translate(172px, -96px) rotate(-8deg); }
        11%, 13% { opacity: 1; transform: translate(172px, -96px) rotate(-8deg); animation-timing-function: cubic-bezier(.5, 0, 1, .7); }
        20% { opacity: 1; transform: translate(172px, 140px) rotate(6deg); }
        20.5%, 100% { opacity: 0; transform: translate(172px, 140px) rotate(6deg); }
      }
      @media (prefers-reduced-motion: reduce) {
        .karl-laddar .kropp, .karl-laddar .lock, .karl-laddar .fraktion, .karl-laddar .karl-text { animation: none; }
        .karl-laddar .bak, .karl-laddar .fraktion { opacity: 0; }
      }
    </style>

    <script>
      // Slumpar en ny text varje gång den föregående har tonat ut. Alla visas innan någon upprepas.
      (function () {
        var texter = [
          'Slänger rester från middagen…', 'Äter upp det sista i kylen först…', 'Tackar av gårdagens gratäng…', 'Skrapar ur stekpannan…', 'Bananen hann bli för brun…',

          'Sköljer ur yoghurtburken…', 'Letar efter rätt lock…', 'Är det här ens plast?', 'Klämmer ihop flaskan…', 'Sköljer lagom mycket…',
          'Rullar ut kärlet till vägen…', 'Oj, är det redan tömning i dag?', 'Springer efter sopbilen…', 'Hoppas på att grannen har plats…', 'Lyfter på locket försiktigt…', 'Sorterar som ett proffs…'
        ]
        var text = document.querySelector('.karl-text')
        var kvar = []
        function nyText() {
          if (!kvar.length) kvar = texter.slice()
          text.textContent = kvar.splice(Math.floor(Math.random() * kvar.length), 1)[0]
        }
        nyText()
        text.addEventListener('animationiteration', nyText)
      })()
    </script>
