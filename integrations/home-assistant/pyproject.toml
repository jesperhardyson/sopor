[project]
name = "sopor-home-assistant"
version = "0.0.0"
description = "Tester för Home Assistant-integrationen Sophämtning (custom_components/sopor)"
requires-python = ">=3.14"

[dependency-groups]
dev = [
  "pytest-homeassistant-custom-component",
  "ruff",
]

[tool.pytest.ini_options]
pythonpath = ["../.."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py314"
line-length = 120
