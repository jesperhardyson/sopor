[project]
name = "sopor-home-assistant"
version = "0.0.0"
description = "Tester för Home Assistant-integrationen Sophämtning (custom_components/sopor)"
requires-python = ">=3.14.2"

[dependency-groups]
dev = [
  "pytest-homeassistant-custom-component",
  "ruff",
]

[tool.pytest.ini_options]
pythonpath = ["../.."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.uv]
# Home Assistant 2026.10 låser Pillow 12.3.0, som har kända sårbarheter.
# Lyft den tills pytest-homeassistant-custom-component följer med HA 2026.11 (Pillow 13).
override-dependencies = ["pillow>=13.0.0"]
