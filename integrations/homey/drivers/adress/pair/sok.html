<p data-i18n="pair.intro"></p>
<form id="form">
  <div class="homey-form-group">
    <label class="homey-form-label" for="q" data-i18n="pair.label"></label>
    <input class="homey-form-input" id="q" type="text" autocomplete="street-address" />
    <p class="homey-form-hint" data-i18n="pair.hint"></p>
  </div>
  <p id="status" role="status"></p>
  <p id="coverage" hidden><span id="coverageText"></span> <a href="#" id="coverageLink" data-i18n="pair.coverageLink"></a></p>
  <button class="homey-button-primary-full" id="search" type="submit" data-i18n="pair.search"></button>
</form>
<div id="places" hidden>
  <p class="homey-form-label" data-i18n="pair.choosePlace"></p>
  <div id="placeList"></div>
</div>
<div id="notices" role="alert" hidden>
  <p class="homey-form-label" data-i18n="pair.noticeIntro"></p>
  <div id="noticeList"></div>
  <div id="areaLinks"></div>
  <button class="homey-button-primary-full" id="noticeContinue" type="button" data-i18n="pair.continue"></button>
</div>

<style>
  #status:empty { display: none; }
  #coverageLink, #areaLinks a { text-decoration: underline; }
  #placeList { display: flex; flex-direction: column; gap: 8px; }
  #noticeList p, #areaLinks p { margin-bottom: 12px; }
</style>

<script type="text/javascript">
  const form = document.getElementById('form')
  const input = document.getElementById('q')
  const status = document.getElementById('status')
  const button = document.getElementById('search')
  const placesBox = document.getElementById('places')
  const placeList = document.getElementById('placeList')
  const noticesBox = document.getElementById('notices')
  input.placeholder = Homey.__('pair.placeholder')

  // Listan över kommunerna finns på sajten, i Homeys egen webbvy
  const coverage = document.getElementById('coverage')
  document.getElementById('coverageLink').addEventListener('click', (event) => {
    event.preventDefault()
    Homey.popup('https://sopor.hardyson.se/bidra#kommuner')
  })
  Homey.emit('coverage').then(({ count }) => {
    if (!count) return
    document.getElementById('coverageText').textContent = Homey.__('pair.coverage', { count })
    coverage.hidden = false
  }, () => {})

  // Utan träff: är orten en kommun som finns är det nog stavningen, annars kanske kommunen
  function notFound({ place, covered }) {
    if (covered === null) return Homey.__('pair.notFound')
    return Homey.__(covered ? 'pair.notFoundCovered' : 'pair.notFoundElsewhere', { place })
  }

  // Den färdiga listan har ingen plats för text, så källans varning visas före den
  function showHits(notices, links, intro) {
    if (!notices.length) return Homey.showView('list_devices')
    placesBox.hidden = true
    document.getElementById('noticeList').replaceChildren(
      ...[...(intro ? [intro] : []), ...notices].map((notice) => {
        const paragraph = document.createElement('p')
        paragraph.textContent = notice
        return paragraph
      }),
    )
    // Områdessidan visar vilka platser som ingår och vem man kan fråga
    document.getElementById('areaLinks').replaceChildren(
      ...links.map(({ kommun, url }) => {
        const link = document.createElement('a')
        link.href = '#'
        link.textContent = Homey.__('pair.areaLink', { kommun })
        link.addEventListener('click', (event) => {
          event.preventDefault()
          Homey.popup(url)
        })
        const paragraph = document.createElement('p')
        paragraph.append(link)
        return paragraph
      }),
    )
    noticesBox.hidden = false
  }
  document.getElementById('noticeContinue').addEventListener('click', () => Homey.showView('list_devices'))

  function showPlaces(places) {
    placeList.replaceChildren(
      ...places.map((place) => {
        const choice = document.createElement('button')
        choice.type = 'button'
        choice.className = 'homey-button-secondary-full'
        choice.textContent = `${place.label} (${place.count})`
        choice.addEventListener('click', async () => {
          const { notices, areaLinks } = await Homey.emit('place', place.key)
          showHits(notices, areaLinks)
        })
        return choice
      }),
    )
    placesBox.hidden = false
  }

  form.addEventListener('submit', async (event) => {
    event.preventDefault()
    const q = input.value.trim()
    placesBox.hidden = true
    noticesBox.hidden = true
    if (q.split(',')[0].trim().length < 3) {
      status.textContent = Homey.__('pair.tooShort')
      return
    }
    button.disabled = true
    status.textContent = Homey.__('pair.searching')
    try {
      // Drivrutinen sparar träffarna åt list_devices
      const answer = await Homey.emit('search', q)
      const { result, places, notices, areaLinks, street } = answer
      status.textContent = ''
      if (result === 'found') return showHits(notices, areaLinks)
      if (result === 'areas') return showHits(notices, areaLinks, Homey.__('pair.areaChoice', { street }))
      if (result === 'places') return showPlaces(places)
      status.textContent = result === 'failed' ? Homey.__('pair.failed') : notFound(answer)
    } catch (error) {
      status.textContent = error.message
    } finally {
      button.disabled = false
    }
  })
</script>
