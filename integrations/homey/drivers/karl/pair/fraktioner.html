<form id="karlForm">
  <fieldset class="homey-form-fieldset">
    <legend class="homey-form-legend" data-i18n="pairKarl.chooseFractions"></legend>
    <div id="karlFractions"></div>
  </fieldset>
  <div class="homey-form-group">
    <p class="homey-form-label" data-i18n="pairKarl.icon"></p>
    <div id="karlIcons" role="radiogroup"></div>
    <p class="homey-form-hint" data-i18n="pairKarl.iconHint"></p>
  </div>
  <div class="homey-form-group">
    <label class="homey-form-label" for="karlName" data-i18n="pairKarl.name"></label>
    <input class="homey-form-input" id="karlName" type="text" />
  </div>
  <p id="karlStatus" role="status"></p>
  <button class="homey-button-primary-full" id="karlAdd" type="submit" disabled data-i18n="pairKarl.add"></button>
</form>

<style>
  #karlStatus:empty { display: none; }
  #karlFractions { margin: 0; }
  /* Rutorna är div:ar med fast höjd. Homeys egna knappstilar gav fel storlek i rutnätet. */
  #karlIcons { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; margin-bottom: 8px; }
  #karlIcons [role='radio'] { box-sizing: border-box; height: 64px; display: flex; align-items: center; justify-content: center; border: 1px solid var(--homey-color-mono-200, #ddd); border-radius: 10px; cursor: pointer; }
  #karlIcons [aria-checked='true'] { border: 2px solid var(--homey-color-highlight, #157a46); background: var(--homey-color-highlight-light, #e8f3ed); }
  #karlIcons img { width: 48px; height: 48px; pointer-events: none; }
</style>

<script type="text/javascript">
  // Homey kör parningsvyerna i samma fönster. Skriptet hålls i en egen funktion, så att namnen inte krockar med andra vyers.
  ;(() => {
    // Ikonerna i drivers/karl/assets. "standard" är drivrutinens egen ikon.
    const ICONS = ['standard', 'rest', 'mat', 'papper', 'plast', 'glas', 'metall', 'tidningar', 'flerfack']
    const iconUrl = (icon) => (icon === 'standard' ? '../assets/icon.svg' : `../assets/icons/${icon}.svg`)

    const form = document.getElementById('karlForm')
    const fractionBox = document.getElementById('karlFractions')
    const iconBox = document.getElementById('karlIcons')
    const nameInput = document.getElementById('karlName')
    const addButton = document.getElementById('karlAdd')
    const status = document.getElementById('karlStatus')

    let icon = 'standard'
    // Förslagen följer valen tills användaren väljer själv
    let ownName = false
    let ownIcon = false

    const selected = () => [...fractionBox.querySelectorAll('input:checked')].map((input) => input.value)

    function showIcon(chosen) {
      icon = chosen
      for (const tile of iconBox.children) tile.setAttribute('aria-checked', String(tile.dataset.icon === chosen))
    }

    iconBox.replaceChildren(
      ...ICONS.map((id) => {
        const tile = document.createElement('div')
        tile.dataset.icon = id
        tile.tabIndex = 0
        tile.setAttribute('role', 'radio')
        const image = document.createElement('img')
        image.src = iconUrl(id)
        image.alt = id
        tile.append(image)
        const choose = () => {
          ownIcon = true
          showIcon(id)
        }
        tile.addEventListener('click', choose)
        tile.addEventListener('keydown', (event) => {
          if (event.key !== 'Enter' && event.key !== ' ') return
          event.preventDefault()
          choose()
        })
        return tile
      }),
    )
    showIcon(icon)

    nameInput.addEventListener('input', () => {
      ownName = nameInput.value.trim() !== ''
    })

    async function update() {
      const fractions = selected()
      addButton.disabled = fractions.length === 0
      const suggestion = await Homey.emit('suggest', fractions)
      if (!ownName) nameInput.value = suggestion.name
      if (!ownIcon) showIcon(suggestion.icon)
    }

    Homey.emit('fractions').then((fractions) => {
      fractionBox.replaceChildren(
        ...fractions.map(({ id, name }) => {
          const label = document.createElement('label')
          label.className = 'homey-form-checkbox'
          label.innerHTML = '<input class="homey-form-checkbox-input" type="checkbox"><span class="homey-form-checkbox-checkmark"></span><span class="homey-form-checkbox-text"></span>'
          const input = label.querySelector('input')
          input.value = id
          input.addEventListener('change', () => update().catch((error) => (status.textContent = error.message)))
          label.querySelector('.homey-form-checkbox-text').textContent = name
          return label
        }),
      )
    }, (error) => {
      status.textContent = error.message
    })

    form.addEventListener('submit', async (event) => {
      event.preventDefault()
      addButton.disabled = true
      try {
        const device = await Homey.emit('device', { fractions: selected(), name: nameInput.value, icon })
        await Homey.createDevice(device)
        Homey.done()
      } catch (error) {
        status.textContent = error.message
        addButton.disabled = false
      }
    })
  })()
</script>
