<p class="homey-form-label" data-i18n="pairKarl.chooseAddress"></p>
<p id="status" role="status"></p>
<div id="list"></div>

<style>
  #status:empty { display: none; }
  #list { display: flex; flex-direction: column; gap: 8px; }
</style>

<script type="text/javascript">
  const status = document.getElementById('status')
  const list = document.getElementById('list')

  async function choose(address) {
    if (!address.ready) {
      status.textContent = Homey.__('pairKarl.notReady')
      return
    }
    await Homey.emit('address', address.id)
    Homey.showView('fraktioner')
  }

  Homey.emit('addresses').then((addresses) => {
    if (!addresses.length) {
      status.textContent = Homey.__('pairKarl.noAddress')
      return
    }
    // En enda adress som har sitt schema: gå vidare direkt
    if (addresses.length === 1 && addresses[0].ready) return choose(addresses[0])
    list.replaceChildren(
      ...addresses.map((address) => {
        const button = document.createElement('button')
        button.type = 'button'
        button.className = 'homey-button-secondary-full'
        button.textContent = address.name
        button.addEventListener('click', () => choose(address))
        return button
      }),
    )
  }, (error) => {
    status.textContent = error.message
  })
</script>
