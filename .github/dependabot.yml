version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      beroenden:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /integrations/homey
    schedule:
      interval: weekly
    # Typerna ska följa Node-versionen som Homey kör (22), inte den senaste
    ignore:
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      homey:
        patterns: ['*']
  # Bara testmiljön: integrationen själv har inga beroenden (requirements: [] i manifest.json)
  - package-ecosystem: uv
    directory: /integrations/home-assistant
    schedule:
      interval: weekly
    groups:
      home-assistant:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
