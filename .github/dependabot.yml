version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      beroenden:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /integrations/homey
    schedule:
      interval: weekly
    groups:
      homey:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
