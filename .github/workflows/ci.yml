name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Adress-id får inte tas bort
        if: github.event_name == 'pull_request'
        run: npm run check:ids -- origin/${{ github.base_ref }}
      - run: npm test
      - run: npm run build
